server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-change-me-please-32b}
    expiration-ms: 86400000
  data-api:
    url: ${DATA_API_URL:http://data-api:8081}
    internal-token: ${INTERNAL_TOKEN:dev-internal-token}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.springframework.web.client: WARN
